    <!-- Custom loading screen: pure inline CSS so it paints instantly,
         even before the JS bundle or the app's own stylesheet has
         downloaded — this is the whole point on a slow connection. -->
    <style>
      #site-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: linear-gradient(180deg, #0a0908 0%, #14120f 100%);
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }

      #site-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #site-loader .loader-mark {
        width: 46px;
        height: 46px;
        position: relative;
      }

      #site-loader .loader-mark span {
        position: absolute;
        inset: 0;
        border: 2px solid transparent;
        border-top-color: #c9a24d;
        border-right-color: #c9a24d;
        border-radius: 50%;
        animation: loader-spin 1s linear infinite;
      }

      #site-loader .loader-mark::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 9px;
        height: 9px;
        background: #f0d998;
        border-radius: 2px;
        transform: translate(-50%, -50%) rotate(45deg);
        animation: loader-pulse 1.6s ease-in-out infinite;
      }

      #site-loader .loader-name {
        font-family: "Playfair Display", Georgia, serif;
        font-size: 20px;
        letter-spacing: 0.5px;
        color: #f5efe0;
      }

      #site-loader .loader-status {
        font-family: "Manrope", "Segoe UI", sans-serif;
        font-size: 12.5px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #b6ac99;
      }

      @keyframes loader-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes loader-pulse {
        0%, 100% {
          opacity: 0.5;
          transform: translate(-50%, -50%) rotate(45deg) scale(0.85);
        }
        50% {
          opacity: 1;
          transform: translate(-50%, -50%) rotate(45deg) scale(1.1);
        }
      }
    </style>
  </head>
  <body>
    <a href="#home" class="skip-to-content">Skip to main content</a>

    <div id="site-loader">
      <div class="loader-mark"><span></span></div>
      <div class="loader-name">Riyan Modassar</div>
      <div class="loader-status">Loading…</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      // Hides the loading screen once the page has fully finished
      // loading (all images, fonts, styles, scripts) — this is what
      // keeps it visible for the right amount of time on a slow
      // connection instead of disappearing too early behind a blank
      // page. A short fallback timer prevents it from ever getting
      // stuck forever if "load" doesn't fire for some reason.
      function hideSiteLoader() {
        var loader = document.getElementById("site-loader");
        if (!loader) return;

        loader.classList.add("is-hidden");
        setTimeout(function () {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 600);
      }

      window.addEventListener("load", hideSiteLoader);
      setTimeout(hideSiteLoader, 8000);

      // register the PWA service worker (safe no-op if unsupported)
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      }
    </script>
  </body>
